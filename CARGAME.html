<meta charset="UTF-8">

<title>No. 23 — Endurance Run</title>
<style>
  :root { --red: #d00405; --white: #f0efec; --asphalt: #251d19; --stone: #9c8c78; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #120e0c; overflow: hidden;
    font-family: "Trebuchet MS", system-ui, sans-serif; color: var(--white); touch-action: none; }
  #wrap { position: relative; height: 100%; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; background: var(--asphalt); box-shadow: 0 0 40px rgba(0,0,0,.6); }
  .screen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; text-align: center; padding: 20px; background: rgba(18,14,12,.72); }
  .screen.hidden { display: none; }
  .photo { width: min(86vw, 380px); border-radius: 10px; border: 3px solid var(--white);
    box-shadow: 0 8px 30px rgba(208,4,5,.45); }
  h1 { margin: 18px 0 4px; font-size: clamp(2rem, 7vw, 3rem); letter-spacing: 1px; font-style: italic; }
  h1 span { background: var(--white); color: var(--red); border-radius: 50%; padding: 0 .28em; font-style: normal; }
  p { margin: 6px 0; max-width: 380px; line-height: 1.45; color: #e8dfd6; }
  .small { font-size: .85rem; color: #b9ab9b; }
  button { margin-top: 16px; padding: 12px 34px; font-size: 1.15rem; font-weight: bold; border: none;
    border-radius: 30px; background: var(--red); color: var(--white); cursor: pointer;
    box-shadow: 0 4px 0 #7a0203; }
  button:active { transform: translateY(3px); box-shadow: 0 1px 0 #7a0203; }
  #mute { position: absolute; bottom: 10px; right: 10px; margin: 0; padding: 6px 10px; font-size: .9rem;
    border-radius: 6px; background: rgba(0,0,0,.45); box-shadow: none; z-index: 5; }
  .big { font-size: 2.6rem; font-weight: bold; color: var(--white); margin: 6px 0; }
</style>
</head>

<script>
/* ===== Palette taken from the photo ===== */
const C = {
  red: '#d00405', redDark: '#8f0203', white: '#f0efec', asphalt: '#2b2420', asphaltLine: '#3a322c',
  stone: '#9c8c78', grass: '#4f6b34', grassDark: '#3f5729', wall: '#b8b2a8', stand: '#6d6a66'
};

const cv = document.getElementById('game'), ctx = cv.getContext('2d');
const W = cv.width, H = cv.height;
const ROAD_L = 78, ROAD_R = W - 78;          // road edges
const CAR_W = 40, CAR_H = 76;

/* ===== Fit canvas to window ===== */
function fit() {
  const s = Math.min(window.innerWidth / W, window.innerHeight / H);
  cv.style.width = W * s + 'px'; cv.style.height = H * s + 'px';
}
addEventListener('resize', fit); fit();

/* ===== Sound (Web Audio, no files) ===== */
let actx = null, muted = false;
function beep(freq, dur = 0.12, type = 'square', vol = 0.08, slide = 0) {
  if (muted) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = freq;
    if (slide) o.frequency.linearRampToValueAtTime(freq + slide, actx.currentTime + dur);
    g.gain.value = vol; g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
    o.connect(g).connect(actx.destination); o.start(); o.stop(actx.currentTime + dur);
  } catch (e) {}
}
document.getElementById('mute').onclick = e => {
  muted = !muted; e.target.textContent = muted ? '🔇' : '🔊';
};

/* ===== Best score ===== */
let best = 0;
try { best = parseFloat(localStorage.getItem('no23-best')) || 0; } catch (e) {}

/* ===== Game state ===== */
let S;
function newGame() {
  S = {
    running: true, t: 0, dist: 0, speed: 320, fuel: 100, lives: 3, inv: 0,
    px: W / 2, pvx: 0, target: null,
    traffic: [], cans: [], parts: [], pops: [], scenery: [],
    spawnT: 0.8, canT: 3, lap: 1, shake: 0, stripe: 0, banner: 1.8
  };
  for (let y = -40; y < H + 40; y += 90) addScenery(y);
}

/* ===== Input ===== */
const keys = {};
addEventListener('keydown', e => {
  keys[e.key.toLowerCase()] = true;
  if (['arrowleft', 'arrowright', ' '].includes(e.key.toLowerCase())) e.preventDefault();
});
addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

function pointerX(e) {
  const r = cv.getBoundingClientRect();
  return (e.clientX - r.left) * W / r.width;
}
cv.addEventListener('pointerdown', e => { if (S && S.running) S.target = pointerX(e); });
cv.addEventListener('pointermove', e => { if (S && S.running && (e.buttons || e.pointerType === 'mouse')) S.target = pointerX(e); });
cv.addEventListener('pointerup',   e => { if (S && e.pointerType !== 'mouse') S.target = null; });

/* ===== Spawning ===== */
const RIVALS = ['#1f4fa8', '#e7c21c', '#2f8f4e', '#e9e6df', '#ef7d1a', '#5b2a86'];
function spawnRival() {
  const lanes = [ROAD_L + 46, W / 2, ROAD_R - 46];
  const x = lanes[Math.floor(Math.random() * 3)] + (Math.random() * 30 - 15);
  if (S.traffic.some(c => c.y < 40 && Math.abs(c.x - x) < CAR_W + 10)) return;
  S.traffic.push({ x, y: -CAR_H, v: 140 + Math.random() * 90, col: RIVALS[Math.floor(Math.random() * RIVALS.length)],
    num: 1 + Math.floor(Math.random() * 98), wob: Math.random() * 6 });
}
function spawnCan() {
  const x = ROAD_L + 30 + Math.random() * (ROAD_R - ROAD_L - 60);
  S.cans.push({ x, y: -30, spin: 0 });
}
function addScenery(y) {
  // left: concrete wall + grass + trees ; right: grass + grandstand blocks (from the photo's background)
  S.scenery.push({ side: 'L', y, tree: Math.random() < 0.6, tx: 14 + Math.random() * 30 });
  S.scenery.push({ side: 'R', y, stand: Math.random() < 0.55, tree: Math.random() < 0.4, tx: W - 20 - Math.random() * 30 });
}

/* ===== Effects ===== */
function burst(x, y, col, n = 18) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = 60 + Math.random() * 220;
    S.parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.6 + Math.random() * 0.4, col });
  }
}
function pop(x, y, text, col = C.white) { S.pops.push({ x, y, text, col, life: 1 }); }

/* ===== Update ===== */
function update(dt) {
  S.t += dt;
  S.speed = Math.min(780, 320 + S.t * 9);
  const scroll = S.speed * dt;
  S.dist += S.speed * dt / 2600;           // km-ish
  S.stripe = (S.stripe + scroll) % 60;
  S.fuel -= dt * (4 + S.t * 0.03);
  S.inv = Math.max(0, S.inv - dt);
  S.shake = Math.max(0, S.shake - dt * 30);
  S.banner = Math.max(0, S.banner - dt);

  // laps every 1.5 km
  const lap = 1 + Math.floor(S.dist / 1.5);
  if (lap > S.lap) { S.lap = lap; S.banner = 1.8; beep(660, 0.15, 'triangle', 0.08); beep(990, 0.2, 'triangle', 0.06); }

  // steering
  const left = keys['arrowleft'] || keys['a'], right = keys['arrowright'] || keys['d'];
  if (left || right) { S.target = null; S.pvx += (right ? 1 : -1) * 2400 * dt; }
  else if (S.target != null) { S.pvx += (S.target - S.px) * 30 * dt; }
  S.pvx *= Math.pow(0.0009, dt);
  S.px += S.pvx * dt;
  const minX = ROAD_L + CAR_W / 2 + 4, maxX = ROAD_R - CAR_W / 2 - 4;
  if (S.px < minX || S.px > maxX) {           // rubbing the kerb slows you a little
    S.px = Math.max(minX, Math.min(maxX, S.px)); S.pvx *= -0.3; S.fuel -= dt * 4;
  }
  const py = H - 120;

  // spawn
  S.spawnT -= dt;
  if (S.spawnT <= 0) { spawnRival(); S.spawnT = Math.max(0.38, 1.25 - S.t * 0.012) * (0.7 + Math.random() * 0.6); }
  S.canT -= dt;
  if (S.canT <= 0) { spawnCan(); S.canT = 3.2 + Math.random() * 2.5; }

  // traffic
  for (const c of S.traffic) {
    c.y += (S.speed - c.v) * dt;
    c.x += Math.sin(S.t * 1.3 + c.wob) * 12 * dt;
    if (S.inv <= 0 && Math.abs(c.x - S.px) < CAR_W - 6 && Math.abs(c.y - py) < CAR_H - 10) {
      S.lives--; S.inv = 1.6; S.shake = 14; c.hit = true;
      burst((c.x + S.px) / 2, (c.y + py) / 2, '#ffb02e', 26);
      pop(S.px, py - 60, 'CRASH!', '#ffb02e'); beep(110, 0.35, 'sawtooth', 0.12, -60);
      if (S.lives <= 0) return end('Too many crashes — the car is out of the race.');
    }
  }
  S.traffic = S.traffic.filter(c => !c.hit && c.y < H + CAR_H);

  // fuel cans
  for (const f of S.cans) {
    f.y += scroll; f.spin += dt * 4;
    if (Math.abs(f.x - S.px) < 34 && Math.abs(f.y - py) < 50) {
      f.got = true; S.fuel = Math.min(100, S.fuel + 32);
      burst(f.x, f.y, C.red, 14); pop(f.x, f.y - 20, '+FUEL', '#ffd94a'); beep(520, 0.1, 'square', 0.07, 400);
    }
  }
  S.cans = S.cans.filter(f => !f.got && f.y < H + 40);
  if (S.fuel <= 0) { S.fuel = 0; return end('Out of fuel — the #23 coasts to a stop.'); }

  // scenery
  for (const s of S.scenery) s.y += scroll;
  S.scenery = S.scenery.filter(s => s.y < H + 60);
  const top = Math.min(...S.scenery.map(s => s.y));
  if (top > -50) addScenery(top - 90);

  // particles + popups
  for (const p of S.parts) { p.x += p.vx * dt; p.y += p.vy * dt + scroll * 0.5; p.vx *= 0.96; p.vy *= 0.96; p.life -= dt; }
  S.parts = S.parts.filter(p => p.life > 0);
  for (const p of S.pops) { p.y -= 50 * dt; p.life -= dt; }
  S.pops = S.pops.filter(p => p.life > 0);

  // exhaust smoke
  if (Math.random() < 0.6) S.parts.push({ x: S.px + (Math.random() * 16 - 8), y: py + CAR_H / 2,
    vx: (Math.random() - 0.5) * 30, vy: 60, life: 0.35, col: 'rgba(200,190,180,0.5)' });
}

/* ===== Drawing ===== */
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }

function drawTrack() {
  // grass both sides
  ctx.fillStyle = C.grass; ctx.fillRect(0, 0, ROAD_L, H); ctx.fillRect(ROAD_R, 0, W - ROAD_R, H);
  // scenery
  for (const s of S.scenery) {
    if (s.side === 'L') {
      ctx.fillStyle = C.wall; ctx.fillRect(ROAD_L - 22, s.y, 8, 92);      // concrete barrier
      if (s.tree) { ctx.fillStyle = C.grassDark; ctx.beginPath(); ctx.arc(s.tx, s.y + 40, 16, 0, 7); ctx.fill(); }
    } else {
      if (s.stand) {                                                     // grandstand roof seen from above
        ctx.fillStyle = C.stand; ctx.fillRect(W - 50, s.y + 6, 46, 78);
        ctx.fillStyle = '#7f7b76'; for (let i = 0; i < 6; i++) ctx.fillRect(W - 46, s.y + 12 + i * 12, 38, 5);
      } else if (s.tree) { ctx.fillStyle = C.grassDark; ctx.beginPath(); ctx.arc(s.tx, s.y + 40, 14, 0, 7); ctx.fill(); }
      ctx.fillStyle = C.wall; ctx.fillRect(ROAD_R + 14, s.y, 8, 92);
    }
  }
  // asphalt
  ctx.fillStyle = C.asphalt; ctx.fillRect(ROAD_L, 0, ROAD_R - ROAD_L, H);
  // kerbs (red/white, like the car)
  for (let y = -60 + S.stripe; y < H; y += 60) {
    ctx.fillStyle = C.red;   ctx.fillRect(ROAD_L - 12, y, 12, 30); ctx.fillRect(ROAD_R, y, 12, 30);
    ctx.fillStyle = C.white; ctx.fillRect(ROAD_L - 12, y + 30, 12, 30); ctx.fillRect(ROAD_R, y + 30, 12, 30);
  }
  // lane dashes
  ctx.fillStyle = C.asphaltLine;
  const l1 = ROAD_L + (ROAD_R - ROAD_L) / 3, l2 = ROAD_L + 2 * (ROAD_R - ROAD_L) / 3;
  for (let y = -60 + S.stripe; y < H; y += 60) { ctx.fillRect(l1 - 3, y, 6, 32); ctx.fillRect(l2 - 3, y, 6, 32); }
}

// Top-down race car. main = body colour, stripe = accent; number shown in a roundel.
function drawCar(x, y, main, stripe, num, isPlayer) {
  ctx.save(); ctx.translate(x, y);
  ctx.fillStyle = 'rgba(0,0,0,0.35)'; rr(-CAR_W / 2 + 3, -CAR_H / 2 + 5, CAR_W, CAR_H, 12); ctx.fill();
  ctx.fillStyle = '#111';                                              // tyres
  [[-1, -1], [1, -1], [-1, 1], [1, 1]].forEach(([sx, sy]) => ctx.fillRect(sx * (CAR_W / 2) - 4, sy * 22 - 8, 8, 16));
  ctx.fillStyle = main; rr(-CAR_W / 2, -CAR_H / 2, CAR_W, CAR_H, 14); ctx.fill();   // body
  if (isPlayer) {                                                      // white swoops over the front wheel arches
    ctx.fillStyle = stripe;
    ctx.beginPath(); ctx.ellipse(-CAR_W / 2 + 6, -20, 7, 16, 0, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.ellipse(CAR_W / 2 - 6, -20, 7, 16, 0, 0, 7); ctx.fill();
    ctx.fillRect(-CAR_W / 2, 18, CAR_W, 6);                            // rear stripe
    ctx.fillStyle = '#ffffe0';                                         // twin headlights
    ctx.beginPath(); ctx.arc(-11, -CAR_H / 2 + 7, 4, 0, 7); ctx.arc(11, -CAR_H / 2 + 7, 4, 0, 7); ctx.fill();
  } else {
    ctx.fillStyle = stripe; ctx.fillRect(-3, -CAR_H / 2, 6, CAR_H);
  }
  ctx.fillStyle = '#141414'; rr(-12, -16, 24, 22, 7); ctx.fill();      // cockpit / windscreen
  ctx.fillStyle = 'rgba(255,255,255,0.25)'; rr(-9, -14, 8, 6, 3); ctx.fill();
  ctx.fillStyle = isPlayer ? C.white : '#fff';                         // number roundel
  ctx.beginPath(); ctx.arc(0, 14, 10, 0, 7); ctx.fill();
  ctx.fillStyle = '#111'; ctx.font = 'bold 12px "Trebuchet MS", sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(num, 0, 15);
  if (isPlayer) { ctx.fillStyle = main; ctx.fillRect(-CAR_W / 2 + 4, CAR_H / 2 - 8, CAR_W - 8, 5); }   // rear wing
  ctx.restore();
}

function drawCan(f) {
  ctx.save(); ctx.translate(f.x, f.y); ctx.rotate(Math.sin(f.spin) * 0.25);
  ctx.fillStyle = 'rgba(255,217,74,0.25)'; ctx.beginPath(); ctx.arc(0, 0, 24 + Math.sin(f.spin * 2) * 3, 0, 7); ctx.fill();
  ctx.fillStyle = C.red; rr(-12, -15, 24, 30, 4); ctx.fill();
  ctx.fillStyle = C.white; ctx.fillRect(-12, -3, 24, 6);
  ctx.fillStyle = '#333'; ctx.fillRect(4, -20, 7, 6);
  ctx.restore();
}

function drawHUD() {
  // fuel bar
  ctx.fillStyle = 'rgba(0,0,0,0.55)'; rr(12, 12, 170, 44, 8); ctx.fill();
  ctx.fillStyle = C.white; ctx.font = 'bold 12px "Trebuchet MS", sans-serif'; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.fillText('FUEL', 22, 30);
  ctx.fillStyle = '#444'; rr(22, 36, 150, 10, 5); ctx.fill();
  const low = S.fuel < 25 && Math.floor(S.t * 6) % 2;
  ctx.fillStyle = low ? '#ffd94a' : (S.fuel < 25 ? C.red : '#5fd16a'); rr(22, 36, 150 * S.fuel / 100, 10, 5); ctx.fill();
  // distance + lives
  ctx.fillStyle = 'rgba(0,0,0,0.55)'; rr(W - 150, 12, 138, 44, 8); ctx.fill();
  ctx.fillStyle = C.white; ctx.textAlign = 'right'; ctx.font = 'bold 20px "Trebuchet MS", sans-serif';
  ctx.fillText(S.dist.toFixed(1) + ' km', W - 22, 36);
  ctx.font = '12px "Trebuchet MS", sans-serif'; ctx.fillText(`Lap ${S.lap} · ${Math.round(S.speed * 0.42)} km/h`, W - 22, 50);
  for (let i = 0; i < 3; i++) {
    ctx.fillStyle = i < S.lives ? C.red : '#555';
    ctx.beginPath(); ctx.arc(22 + i * 22, 74, 8, 0, 7); ctx.fill();
    ctx.fillStyle = C.white; ctx.fillRect(16 + i * 22, 73, 12, 3);
  }
  if (S.banner > 0) {
    ctx.globalAlpha = Math.min(1, S.banner);
    ctx.fillStyle = C.red; ctx.fillRect(0, H / 2 - 40, W, 70);
    ctx.fillStyle = C.white; ctx.textAlign = 'center'; ctx.font = 'italic bold 34px "Trebuchet MS", sans-serif';
    ctx.fillText(S.lap === 1 ? 'GREEN FLAG!' : `LAP ${S.lap} — faster!`, W / 2, H / 2 + 7);
    ctx.globalAlpha = 1;
  }
}

function draw() {
  ctx.save();
  if (S.shake) ctx.translate((Math.random() - 0.5) * S.shake, (Math.random() - 0.5) * S.shake);
  drawTrack();
  S.cans.forEach(drawCan);
  S.traffic.forEach(c => drawCar(c.x, c.y, c.col, 'rgba(255,255,255,0.7)', c.num, false));
  for (const p of S.parts) { ctx.globalAlpha = Math.max(0, p.life); ctx.fillStyle = p.col; ctx.fillRect(p.x - 2, p.y - 2, 4, 4); }
  ctx.globalAlpha = 1;
  if (!(S.inv > 0 && Math.floor(S.inv * 10) % 2)) drawCar(S.px, H - 120, C.red, C.white, 23, true);
  for (const p of S.pops) {
    ctx.globalAlpha = Math.max(0, p.life); ctx.fillStyle = p.col; ctx.textAlign = 'center';
    ctx.font = 'bold 22px "Trebuchet MS", sans-serif'; ctx.fillText(p.text, p.x, p.y);
  }
  ctx.globalAlpha = 1;
  ctx.restore();
  drawHUD();
}

/* ===== Loop ===== */
let last = 0;
function frame(ts) {
  const dt = Math.min(0.05, (ts - last) / 1000 || 0); last = ts;
  if (S && S.running) { update(dt); }
  if (S) draw();
  requestAnimationFrame(frame);
}

function end(reason) {
  S.running = false;
  const km = S.dist;
  if (km > best) { best = km; try { localStorage.setItem('no23-best', best.toFixed(2)); } catch (e) {} }
  document.getElementById('overReason').textContent = reason;
  document.getElementById('overScore').textContent = km.toFixed(1) + ' km';
  document.getElementById('overBest').textContent = `Best run: ${best.toFixed(1)} km · reached lap ${S.lap}`;
  document.getElementById('over').classList.remove('hidden');
  beep(300, 0.5, 'sawtooth', 0.08, -200);
}

function start() {
  document.getElementById('title').classList.add('hidden');
  document.getElementById('over').classList.add('hidden');
  newGame();
  beep(440, 0.15, 'square', 0.06); setTimeout(() => beep(880, 0.25, 'square', 0.06), 160);
}
document.getElementById('startBtn').onclick = start;
document.getElementById('againBtn').onclick = start;
addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && (!S || !S.running)) start();
});

// draw an idle track behind the title screen
newGame(); S.running = false;
requestAnimationFrame(frame);
</script>
</body>
